 name: Build JARVIS APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get JARVIS source
        uses: actions/checkout@v4

      - name: Build APK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          PLATFORM="$SDK/platforms/android-35/android.jar"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)

          echo "SDK: $SDK"
          echo "Build tools: $BT"

          mkdir -p build/gen build/classes build/dex build/compiled

          echo "Compiling resources..."
          "$BT/aapt2" compile \
            --dir res \
            -o build/compiled/resources.zip

          echo "Linking Android resources..."
          "$BT/aapt2" link \
            -o build/unsigned.apk \
            -I "$PLATFORM" \
            --manifest AndroidManifest.xml \
            --java build/gen \
            --auto-add-overlay

          echo "Compiling Java..."
          javac \
            -source 8 \
            -target 8 \
            -classpath "$PLATFORM" \
            -d build/classes \
            $(find src -name "*.java") \
            $(find build/gen -name "*.java")

          echo "Creating DEX..."
          "$BT/d8" \
            --lib "$PLATFORM" \
            --output build/dex \
            $(find build/classes -name "*.class")

          echo "Adding DEX to APK..."
          cd build
          zip -j unsigned.apk dex/classes.dex

          echo "Aligning APK..."
          "$BT/zipalign" -f 4 unsigned.apk aligned.apk

          echo "Creating signing key..."
          keytool -genkeypair \
            -keystore jarvis.keystore \
            -alias jarvis \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=JARVIS"

          echo "Signing APK..."
          "$BT/apksigner" sign \
            --ks jarvis.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out JARVIS.apk \
            aligned.apk

          "$BT/apksigner" verify JARVIS.apk

          echo "JARVIS APK BUILD SUCCESSFUL!"

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: build/JARVIS.apk
